name: Test reconciler

on:
  push:
    branches:
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: python -m pip install -e .

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: CLI help smoke test
        run: hl-balance --help
