name: Test reconciler

on:
  push:
    branches:
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: CLI help smoke test
        run: hl-balance --help

  private_hyperevm:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/hyperevm-replay'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Query historical HyperEVM state and indexed tokens
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, hmac, json, os
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          from hl_reconciler.hyperevm import EvmRpcClient, find_block_at_or_before, wei_to_hype
          from hl_reconciler.timeutils import parse_local_cutoff, to_millis

          key = os.environ['BLOCKSCOUT_API_KEY'].encode()
          if not key:
              raise RuntimeError('BLOCKSCOUT_API_KEY secret is missing')

          def xor_stream(data: bytes, key: bytes) -> bytes:
              stream = bytearray()
              counter = 0
              while len(stream) < len(data):
                  stream.extend(hmac.new(key, counter.to_bytes(8, 'big'), hashlib.sha256).digest())
                  counter += 1
              return bytes(a ^ b for a, b in zip(data, stream))

          encrypted_wallet = 'Q7awOn9WcxQXq6VnvPohemk6gKa5Hx/1OAcwss19mgVdNbV7XB98rA+W'
          wallet = xor_stream(base64.b64decode(encrypted_wallet), key).decode()
          cutoff_ms = to_millis(parse_local_cutoff('2026-06-01T00:00:00', 'America/Regina'))
          rpc = EvmRpcClient('https://rpc.hypurrscan.io/')
          located = find_block_at_or_before(rpc, cutoff_ms // 1000)
          native = rpc.native_balance(wallet, located.number)

          body = json.dumps({'address': wallet}).encode()
          req = Request(
              'https://trace.hypurrscan.io/api/v1/address/tokens/indexed',
              data=body,
              headers={'Content-Type': 'application/json', 'Accept': 'application/json'},
              method='POST',
          )
          try:
              with urlopen(req, timeout=30) as resp:
                  indexed_tokens = json.loads(resp.read().decode())
                  indexed_status = resp.status
          except HTTPError as exc:
              indexed_status = exc.code
              indexed_tokens = {'http_error': exc.read().decode(errors='replace')}

          result = {
              'status': 'ok',
              'method': 'hypurrscan_historical_rpc_plus_hypurrtrace',
              'block_number': located.number,
              'block_timestamp_s': located.timestamp_s,
              'native_hype_wei': str(native),
              'native_hype': wei_to_hype(native),
              'indexed_tokens_http_status': indexed_status,
              'indexed_tokens': indexed_tokens,
          }
          ciphertext = xor_stream(json.dumps(result, sort_keys=True).encode(), key)
          with open('hyperevm_result.enc', 'wb') as f:
              f.write(base64.b64encode(ciphertext))
          PY
      - name: Upload encrypted result
        uses: actions/upload-artifact@v4
        with:
          name: hyperevm-encrypted-result
          path: hyperevm_result.enc
          retention-days: 1
